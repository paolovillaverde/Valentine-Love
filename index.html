<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* Tiled background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://media1.tenor.com/m/o9c6lRvOpMkAAAAd/dazai-dazai-osamu.gif");
    background-repeat: repeat;
    background-size: 20% 33.333%;
    opacity: 0.75;
    z-index: -1;
}

.container {
    text-align: center;
}

/* ENVELOPE */
.envelope {
    width: 520px;
    height: 320px;
    background: white;
    position: relative;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    overflow: hidden;
    transform-style: preserve-3d;
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 260px solid transparent;
    border-right: 260px solid transparent;
    border-top: 180px solid #eee;
    transform-origin: top;
    transition: transform 1.2s ease;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* HEART ON ENVELOPE */
.envelope-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 72px;
    color: #ff4d6d;
    animation: pulse 1.4s infinite;
    pointer-events: none;
}

.envelope.open .envelope-heart {
    opacity: 0;
    transition: opacity 0.5s;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

.open-text {
    margin-top: 20px;
    font-weight: bold;
    font-size: 50px;
font-family: "Lucida Handwriting";
    color: hotpink;
    text-transform: uppercase;
    line-height: 1.1;
    -webkit-text-stroke: 5px black;
    paint-order: stroke fill;
}

/* HEART CONFETTI */
.heart {
    position: absolute;
    color: pink;
    animation: floatUp 3s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    100% {
        opacity: 0;
        transform: translateY(-240px) scale(2);
    }
}

/* CONTENT */
.content {
    display: none;
    margin-top: 30px;
}

.content img {
    max-width: 480px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

/* MESSAGE */
.typing {
    margin-top: 30px;
    font-size: 50px;
    font-family: "Lucida Handwriting";
    color: hotpink;
    text-transform: uppercase;
    line-height: 1.1;
    -webkit-text-stroke: 5px black;
    paint-order: stroke fill;
}
</style>
</head>

<body>

<div class="container">
    <div class="envelope" onclick="openEnvelope()">
        <div class="flap"></div>
        <div class="envelope-heart">❤</div>
    </div>
    <div class="open-text">OPEN THIS 💌</div>

    <div class="content">
        <img src="https://66.media.tumblr.com/7c28e0011d586dc2b255a85859af84a6/tumblr_inline_ozt5ayRQfD1u139y7_540.gif">
        <div class="typing" id="typing"></div>
    </div>
</div>

<script>
function openEnvelope() {
    const envelope = document.querySelector('.envelope');
    envelope.classList.add('open');

    for (let i = 0; i < 35; i++) {
        createHeart();
    }

    setTimeout(() => {
        envelope.style.display = 'none';
        document.querySelector('.open-text').style.display = 'none';
        document.querySelector('.content').style.display = 'block';
        typeText("HAPPY VALENTINE'S DAY, MAMI! I LOVE YOU!");
    }, 1300);
}

function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.bottom = '0px';
    heart.style.fontSize = (20 + Math.random() * 40) + 'px';
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 2000);
}

function typeText(text) {
    let i = 0;
    const speed = 70;
    const typingDiv = document.getElementById("typing");

    function typing() {
        if (i < text.length) {
            typingDiv.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}
</script>

</body>
</html>
