<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* Tiled background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://media1.tenor.com/m/o9c6lRvOpMkAAAAd/dazai-dazai-osamu.gif");
    background-repeat: repeat;
    background-size: 20% 33.333%;
    opacity: 0.75;
    z-index: -1;
}

.container {
    text-align: center;
}

/* ENVELOPE */
.envelope {
    width: 520px;
    height: 320px;
    background: white;
    position: relative;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    overflow: hidden;
    transform-style: preserve-3d;
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 260px solid transparent;
    border-right: 260px solid transparent;
    border-top: 180px solid #eee;
    transform-origin: top;
    transition: transform 1.2s ease;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* HEART ON ENVELOPE */
.envelope-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 72px;
