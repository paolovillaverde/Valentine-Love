<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      color: #b30059;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1.5rem;
      margin-bottom: 1.5em;
    }
    .heart {
      color: red;
      font-size: 2rem;
      animation: heartbeat 1s infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    button {
      padding: 0.5em 1em;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #b30059;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #e60073;
    }
  </style>
</head>
<body>
  <h1>Happy Valentine’s Day! <span class="heart">❤️</span></h1>
  <p>Sending you love and warm wishes today!</p>
  <button onclick="alert('💌 You clicked me!')">Click Me</button>
</body>
</html>
